<!doctype html>
<!--
  Title / chapter card for the demo video ("Midnight Atelier" palette, self-hosted fonts).
  Query: ?kicker=…&title=…&accent=…&sub=…&items=a|b|c&mono=…   (title text before the accent word, accent in italic)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Fraunces";
        font-style: italic;
        src: url("../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-italic.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist";
        src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --void: oklch(0.14 0.02 300);
        --ink: oklch(0.94 0.015 80);
        --mist: oklch(0.74 0.02 300);
        --mute: oklch(0.58 0.02 300);
        --accent: oklch(0.78 0.14 65);
        --phosphor: oklch(0.85 0.12 170);
        --ion: oklch(0.8 0.03 290);
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--void);
        color: var(--ink);
        font-family: "Geist", system-ui, sans-serif;
      }
      body::before {
        /* candle glow from below, moon veil from above */
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60% 45% at 50% 115%, oklch(0.78 0.14 65 / 0.18), transparent 70%),
          radial-gradient(40% 35% at 78% -5%, oklch(0.9 0.02 290 / 0.14), transparent 70%);
      }
      body::after {
        /* film grain */
        content: "";
        position: fixed;
        inset: -50%;
        opacity: 0.05;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .moon {
        position: fixed;
        right: 210px;
        top: 150px;
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 36%, oklch(0.97 0.01 90), oklch(0.82 0.02 290) 62%, oklch(0.6 0.03 300));
        box-shadow: 0 0 120px oklch(0.9 0.02 290 / 0.35);
        opacity: 0.85;
      }
      main {
        position: relative;
        z-index: 1;
        padding: 0 190px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
      }
      .kicker {
        font-size: 22px;
        font-weight: 550;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
      }
      h1 {
        margin: 0;
        font-family: "Fraunces", serif;
        font-weight: 340;
        font-variation-settings: "SOFT" 50;
        font-size: 128px;
        line-height: 0.98;
        letter-spacing: -0.028em;
        max-width: 1380px;
      }
      h1 em {
        font-style: italic;
        font-variation-settings: "SOFT" 100, "WONK" 1;
        color: var(--accent);
      }
      .sub {
        font-size: 36px;
        line-height: 1.35;
        color: var(--mist);
        max-width: 1300px;
      }
      ul {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 60px;
        max-width: 1500px;
      }
      li {
        font-size: 30px;
        color: var(--ink);
        padding-left: 30px;
        position: relative;
      }
      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.5em;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--phosphor);
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 28px;
        color: var(--ion);
        font-variant-numeric: tabular-nums slashed-zero;
      }
      .rise {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(6px);
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .rise:nth-child(2) { animation-delay: 0.15s; }
      .rise:nth-child(3) { animation-delay: 0.35s; }
      .rise:nth-child(4) { animation-delay: 0.55s; }
      .rise:nth-child(5) { animation-delay: 0.75s; }
      @keyframes rise {
        to { opacity: 1; transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <div class="moon"></div>
    <main id="card"></main>
    <script>
      const q = new URLSearchParams(location.search);
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };
      const card = document.getElementById("card");
      if (q.get("kicker")) card.append(el("div", "kicker rise", q.get("kicker")));
      const h1 = el("h1", "rise");
      h1.append(document.createTextNode(q.get("title") ?? "GhostPacket"));
      if (q.get("accent")) {
        h1.append(document.createTextNode(" "));
        h1.append(el("em", "", q.get("accent")));
      }
      card.append(h1);
      if (q.get("sub")) card.append(el("div", "sub rise", q.get("sub")));
      if (q.get("items")) {
        const ul = el("ul", "rise");
        for (const it of q.get("items").split("|")) ul.append(el("li", "", it));
        card.append(ul);
      }
      if (q.get("mono")) card.append(el("div", "mono rise", q.get("mono")));
      document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
    </script>
  </body>
</html>
