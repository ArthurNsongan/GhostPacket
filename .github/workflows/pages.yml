# Alternative static deployment to GitHub Pages through Actions (HTTPS).
# The WASM glue and binary are committed, so no Rust toolchain is needed here.
# Manual trigger only: the default deployment is `node scripts/deploy-gh-pages.mjs`
# (gh-pages branch), which needs no Actions minutes.
# To use this workflow instead: Settings → Pages → Source: "GitHub Actions", then run it
# from the Actions tab (and add `push: { branches: [main] }` below for automatic deploys).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install
        run: npm ci
      - name: Build static export
        run: npm run build:pages
        env:
          # Project pages live under /<repo>; user pages (<user>.github.io) have an empty base path.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
