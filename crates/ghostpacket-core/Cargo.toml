[package]
name = "ghostpacket-core"
version = "0.1.0"
edition = "2021"
description = "GhostPacket core: compact signed frames, 4-FSK acoustic modem and Luby Transform optical fountain, compiled to WebAssembly."
license = "MIT"
repository = "https://github.com/ghostpacket/ghostpacket"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-wasm-bindgen = "0.6"
postcard = { version = "1", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
crc32fast = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
rustfft = { version = "6", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
